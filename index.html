<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ספרות קבוצת יפו</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 6px 12px;
      font-size: 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    .add-btn { background: #007bff; }
    .plus { background: #28a745; }
    .minus { background: #dc3545; }
    .sold-btn { background: #6f42c1; }

    .trash {
      cursor: pointer;
      color: red;
      font-size: 20px;
    }

    .search {
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      vertical-align: middle;
    }

    .qty-controls {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .price-input {
      width: 80px;
      padding: 5px;
      font-size: 14px;
      text-align: center;
    }

    .search-cash-row {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      align-items: center;
    }

    .search-box {
      flex: 2;
    }

    .cash-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cash-label {
      font-weight: bold;
      white-space: nowrap;
    }

    .cash-input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      text-align: center;
      border: 2px solid #28a745;
      border-radius: 5px;
    }

    @media (max-width: 600px) {
      .form {
        flex-direction: column;
      }
      .search-cash-row {
        flex-direction: column;
      }
      .search-box, .cash-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>ספרות קבוצת יפו</h1>

  <div class="container">

    <!-- הוספת מוצר -->
    <div class="form">
      <input type="text" id="productName" placeholder="שם המוצר" />
      <input type="number" id="productQty" placeholder="כמות התחלתית" min="1" />
      <button class="add-btn" onclick="addProduct()">הוסף</button>
    </div>

    <!-- חיפוש וקופה -->
    <div class="search-cash-row">
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="חיפוש מוצר..." 
          oninput="renderTable()" />
      </div>
      <div class="cash-box">
        <span class="cash-label">קופה:</span>
        <input 
          type="number" 
          id="cashInput" 
          class="cash-input"
          placeholder="0" 
          step="0.01"
          oninput="updateCash(this.value)" />
      </div>
    </div>

    <!-- טבלה -->
    <table>
      <thead>
        <tr>
          <th>שם המוצר</th>
          <th>כמות</th>
          <th>מחיר</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="inventoryTable"></tbody>
    </table>

  </div>

  <script>
    let inventory = JSON.parse(localStorage.getItem("inventory")) || {};
    let cashRegister = parseFloat(localStorage.getItem("cashRegister")) || 0;

    function saveInventory() {
      localStorage.setItem("inventory", JSON.stringify(inventory));
    }

    function saveCash() {
      localStorage.setItem("cashRegister", cashRegister.toString());
    }

    function updateCash(value) {
      cashRegister = parseFloat(value) || 0;
      saveCash();
    }

    function loadCash() {
      cashInput.value = cashRegister;
    }

    function addProduct() {
      const name = productName.value.trim();
      const qty = parseInt(productQty.value);

      if (!name || qty <= 0) return;

      if (!inventory[name]) {
        inventory[name] = { qty: 0, price: 0 };
      }
      
      inventory[name].qty += qty;

      saveInventory();
      renderTable();

      productName.value = "";
      productQty.value = "";
    }

    function changeQty(name, delta) {
      inventory[name].qty += delta;
      if (inventory[name].qty < 0) inventory[name].qty = 0;

      // Изменение кассы: минус добавляет (продажа), плюс убавляет (возврат)
      const priceChange = inventory[name].price * delta;
      cashRegister -= priceChange; // минус добавляет, плюс убавляет

      saveInventory();
      saveCash();
      renderTable();
      loadCash();
    }

    function updatePrice(name, newPrice) {
      inventory[name].price = parseFloat(newPrice) || 0;
      saveInventory();
    }

    function sellProduct(name) {
      const sold = parseInt(prompt("הכנס כמות שנמכרה:"));
      if (isNaN(sold) || sold <= 0) return;

      inventory[name].qty -= sold;
      if (inventory[name].qty < 0) inventory[name].qty = 0;

      // Добавление денег в кассу (количество × цена)
      const totalPrice = sold * inventory[name].price;
      cashRegister += totalPrice;

      saveInventory();
      saveCash();
      renderTable();
      loadCash();
    }

    function deleteProduct(name) {
      if (!confirm("למחוק את המוצר?")) return;
      delete inventory[name];
      saveInventory();
      renderTable();
    }

    function renderTable() {
      const search = searchInput.value.toLowerCase();
      inventoryTable.innerHTML = "";

      for (let name in inventory) {
        if (!name.toLowerCase().includes(search)) continue;

        const item = inventory[name];
        
        inventoryTable.innerHTML += `
          <tr>
            <td>${name}</td>
            <td>${item.qty}</td>
            <td>
              <input 
                type="number" 
                class="price-input" 
                value="${item.price}" 
                onchange="updatePrice('${name}', this.value)"
                placeholder="מחיר"
                step="0.01"
                min="0"
              />
            </td>
            <td>
              <div class="qty-controls">
                <button class="plus" onclick="changeQty('${name}', 1)">+</button>
                <button class="minus" onclick="changeQty('${name}', -1)">−</button>
                <button class="sold-btn" onclick="sellProduct('${name}')">נמכר</button>
                <span class="trash" onclick="deleteProduct('${name}')">🗑️</span>
              </div>
            </td>
          </tr>
        `;
      }
    }

    renderTable();
    loadCash();
  </script>

</body>
</html>
